name: Build Android APK
on:
  push:
    branches: [pvz-pokemon-defense-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web game
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Lock landscape orientation
        run: node scripts/patch-android.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pokemon-Lane-Clash-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Lane-Clash-v0.1-APK
          path: Pokemon-Lane-Clash-v0.1.apk
          if-no-files-found: error
          retention-days: 30
